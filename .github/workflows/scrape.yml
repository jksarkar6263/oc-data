name: Scrape Tick2Trade

on:
  workflow_dispatch:   # manual trigger
  schedule:
    - cron: "0 6 * * *"   # daily at 6 AM UTC

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Generate slug map
        run: node slug.js

      - name: Run scraper
        run: npm start

      - name: Commit results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add symbolMap.json scraped.json
          git commit -m "Update slugs and scraped data"
          git push
