name: Collect Trendlyne Option Chain


on:

  workflow_dispatch:


jobs:

  collect:

    runs-on: ubuntu-latest


    steps:

    - name: Checkout
      uses: actions/checkout@v4


    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 22


    - name: Install packages
      run: npm install


    - name: Install Chromium
      run: npx playwright install chromium


    - name: Run collector
      run: npm run collect


    - name: Upload JSON
      uses: actions/upload-artifact@v4
      with:

        name: option-chain-json

        path: option-chain.json
